<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>
  <link rel="stylesheet" href="index.css">
</head>
<script>
    const letters = document.querySelectorAll(".letter");

    function handleOrientation(event) {
        let gamma = event.gamma || 0; // Left / right tilt
        let beta = event.beta || 0;   // Front / back tilt

        // Limit movement
        gamma = Math.max(-30, Math.min(30, gamma));
        beta = Math.max(-30, Math.min(30, beta));

        letters.forEach((letter, index) => {

            // Different movement for each letter
            const rotateY = gamma * 0.8;
            const rotateX = beta * -0.4;

            letter.style.transform =
                `perspective(500px)
                 rotateX(${rotateX}deg)
                 rotateY(${rotateY}deg)`;
        });
    }

    // iOS requires permission
    async function enableOrientation() {

        if (
            typeof DeviceOrientationEvent !== "undefined" &&
            typeof DeviceOrientationEvent.requestPermission === "function"
        ) {
            try {
                const permission =
                    await DeviceOrientationEvent.requestPermission();

                if (permission === "granted") {
                    window.addEventListener(
                        "deviceorientation",
                        handleOrientation
                    );
                }
            } catch (error) {
                console.log(error);
            }

        } else {
            // Android and other browsers
            window.addEventListener(
                "deviceorientation",
                handleOrientation
            );
        }
    }

    // Start orientation detection
    enableOrientation();
</script>
<body>
