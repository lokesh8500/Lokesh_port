<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>
  <link rel="stylesheet" href="index.css">
</head>
<script>
const letters = document.querySelectorAll(".letter");

function handleOrientation(event) {

    let gamma = event.gamma || 0;
    let beta = event.beta || 0;

    // Limit phone movement
    gamma = Math.max(-25, Math.min(25, gamma));
    beta = Math.max(-25, Math.min(25, beta));

    letters.forEach((letter, index) => {

        // Slight difference between letters
        const offset = (index - 5) * 0.5;

        const rotateY = -(gamma + offset) * 1.2;
        const rotateX = beta * 0.5;

        letter.style.transform = `
            perspective(600px)
            rotateX(${rotateX}deg)
            rotateY(${rotateY}deg)
        `;
    });
}

function startOrientation() {

    if (
        typeof DeviceOrientationEvent !== "undefined" &&
        typeof DeviceOrientationEvent.requestPermission === "function"
    ) {

        DeviceOrientationEvent.requestPermission()
            .then(permission => {

                if (permission === "granted") {
                    window.addEventListener(
                        "deviceorientation",
                        handleOrientation
                    );
                }

            })
            .catch(console.error);

    } else {

        window.addEventListener(
            "deviceorientation",
            handleOrientation
        );
    }
}

startOrientation();
</script>
<body>
  <div class="bg"></div>

  <main class="container">
    <div class="letters">
      <div class="letter">L</div><div class="letter">O</div><div class="letter">K</div>
      <div class="letter">E</div><div class="letter">S</div><div class="letter">H</div>
